<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="317" viewBox="0 0 1200 317" role="img" aria-labelledby="t d">
  <title id="t">Impact highlights</title>
  <desc id="d">~40% faster Student Portal; 250K+ students served; ~55% fewer redundant API calls; ~45% faster search &amp; filter; 100% Jest coverage; 6 developers led</desc>
  <defs>
    <linearGradient id="ig" x1="0" x2="1"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  </defs>
  <style>
    .tile{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes up{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
    .fill{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    @media (prefers-reduced-motion: reduce){.tile,.fill{animation:none;opacity:1;transform:none}}
  </style>
  
  <g class="tile" style="animation-delay:0.00s" transform="translate(0.5,0.5)">
    <rect width="389" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="800" fill="url(#ig)" letter-spacing="-1">~40%</text>
    <text x="28" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1f2328">faster Student Portal</text>
    <text x="28" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#57606a">lazy routes · fewer re-renders · smaller bundle</text>
    <rect x="28" y="130" width="333" height="5" rx="2.5" fill="#eaeef2"/>
    <rect class="fill" style="animation-delay:0.30s" x="28" y="130" width="133" height="5" rx="2.5" fill="url(#ig)"/>
  </g>
  <g class="tile" style="animation-delay:0.12s" transform="translate(405.5,0.5)">
    <rect width="389" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="800" fill="url(#ig)" letter-spacing="-1">250K+</text>
    <text x="28" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1f2328">students served</text>
    <text x="28" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#57606a">across 550+ universities, 7 user roles</text>
    <rect x="28" y="130" width="333" height="5" rx="2.5" fill="#eaeef2"/>
    <rect class="fill" style="animation-delay:0.42s" x="28" y="130" width="333" height="5" rx="2.5" fill="url(#ig)"/>
  </g>
  <g class="tile" style="animation-delay:0.24s" transform="translate(810.5,0.5)">
    <rect width="389" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="800" fill="url(#ig)" letter-spacing="-1">~55%</text>
    <text x="28" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1f2328">fewer redundant API calls</text>
    <text x="28" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#57606a">debounced search, sorting &amp; pagination</text>
    <rect x="28" y="130" width="333" height="5" rx="2.5" fill="#eaeef2"/>
    <rect class="fill" style="animation-delay:0.54s" x="28" y="130" width="183" height="5" rx="2.5" fill="url(#ig)"/>
  </g>
  <g class="tile" style="animation-delay:0.36s" transform="translate(0.5,166.5)">
    <rect width="389" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="800" fill="url(#ig)" letter-spacing="-1">~45%</text>
    <text x="28" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1f2328">faster search &amp; filter</text>
    <text x="28" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#57606a">across 4 role-based Interstride portals</text>
    <rect x="28" y="130" width="333" height="5" rx="2.5" fill="#eaeef2"/>
    <rect class="fill" style="animation-delay:0.66s" x="28" y="130" width="150" height="5" rx="2.5" fill="url(#ig)"/>
  </g>
  <g class="tile" style="animation-delay:0.48s" transform="translate(405.5,166.5)">
    <rect width="389" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="800" fill="url(#ig)" letter-spacing="-1">100%</text>
    <text x="28" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1f2328">Jest coverage</text>
    <text x="28" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#57606a">on every American Express feature I owned</text>
    <rect x="28" y="130" width="333" height="5" rx="2.5" fill="#eaeef2"/>
    <rect class="fill" style="animation-delay:0.78s" x="28" y="130" width="333" height="5" rx="2.5" fill="url(#ig)"/>
  </g>
  <g class="tile" style="animation-delay:0.60s" transform="translate(810.5,166.5)">
    <rect width="389" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="800" fill="url(#ig)" letter-spacing="-1">6</text>
    <text x="28" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#1f2328">developers led</text>
    <text x="28" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#57606a">promoted to Team Leader at Koli Infotech</text>
    <rect x="28" y="130" width="333" height="5" rx="2.5" fill="#eaeef2"/>
    <rect class="fill" style="animation-delay:0.90s" x="28" y="130" width="200" height="5" rx="2.5" fill="url(#ig)"/>
  </g>
