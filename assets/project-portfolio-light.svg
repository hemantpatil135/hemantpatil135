<svg xmlns="http://www.w3.org/2000/svg" width="590" height="230" viewBox="0 0 590 230" role="img" aria-labelledby="t d">
  <title id="t">hemant-portfolio</title><desc id="d">My portfolio: dynamic Open Graph image, JSON-LD, sitemap, a validated contact API route and lazy-loaded 3D scenes that respect prefers-reduced-motion.</desc>
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0891b2"/><stop offset=".6" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x=".5" y=".5" width="589" height="229" rx="16"/></clipPath>
  </defs>
  <style>
    .in{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes up{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
    .sheen{animation:sweep 5s ease-in-out 1s infinite}
    @keyframes sweep{0%{transform:translateX(-300px)}40%,100%{transform:translateX(890px)}}
    .edge{stroke-dasharray:60 1640;animation:trace 6s linear infinite}
    @keyframes trace{to{stroke-dashoffset:-1700}}
    .live{transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite}
    @keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
  </style>
  <rect x=".5" y=".5" width="589" height="229" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
  <g clip-path="url(#c)"><rect class="sheen" x="0" y="0" width="160" height="230" fill="url(#sheen)" transform="skewX(-20)"/></g>
  <rect class="edge" x=".5" y=".5" width="589" height="229" rx="16" fill="none" stroke="url(#g)" stroke-width="2"/>
  <g class="in">
    <rect x="28" y="26" width="44" height="44" rx="12" fill="url(#g)" opacity=".16"/>
    <text x="50" y="57" text-anchor="middle" font-size="22">🌐</text>
    <text x="88" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#1f2328">hemant-portfolio</text>
    <g><circle class="live" cx="498" cy="48" r="5" fill="#22c55e"/><circle cx="498" cy="48" r="5" fill="#22c55e"/><text x="510" y="53" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#22c55e">LIVE</text></g>
    <text x="28" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#57606a">My portfolio: dynamic Open Graph image, JSON-LD, sitemap, a</text><text x="28" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#57606a">validated contact API route and lazy-loaded 3D scenes that</text><text x="28" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#57606a">respect prefers-reduced-motion.</text>
    <rect x="28" y="176" width="98" height="26" rx="13" fill="url(#g)" opacity=".14"/><text x="77" y="193.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#1f2328">Next.js 15</text><rect x="134" y="176" width="83" height="26" rx="13" fill="url(#g)" opacity=".14"/><text x="175.5" y="193.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#1f2328">React 19</text><rect x="225" y="176" width="98" height="26" rx="13" fill="url(#g)" opacity=".14"/><text x="274" y="193.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#1f2328">TypeScript</text>
  </g>
</svg>
