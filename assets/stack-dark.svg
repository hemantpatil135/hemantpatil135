  <title id="t">Tech stack</title><desc id="d">Frontend: React, Next.js, TypeScript, Redux Toolkit, Redux Saga, Micro frontends, Context API. UI &amp; design systems: Material UI, Tailwind CSS, Storybook, React Hook Form, Yup, Chart.js. Performance: Code splitting, Lazy loading, Render optimization, Bundle size, Lighthouse, Core Web Vitals. Quality &amp; delivery: Jest, Code review, GitHub Actions, Jenkins, GitLab CI, Bitbucket. Backend &amp; data: Node.js, REST APIs, MySQL, MongoDB, MSW</desc>
